<section class="weather">
  <header><b data-text="config.location_name"></b><em data-text="data.stale"></em></header>
  <div class="current">
    <i class="qw-icon qw-icon-lg" data-class="data.weatherIcon" aria-hidden="true"></i>
    <div class="metrics-inline"><strong data-text="data.temperature"></strong><span>HUM <i data-text="data.humidity"></i>%</span><span>PRESS <i data-text="data.pressure"></i> hPa</span></div>
    <aside><b>UV <i data-text="data.uv"></i></b></aside>
  </div>
  <div class="metrics">
    <svg class="compass" viewBox="0 0 100 100"><circle cx="50" cy="50" r="43"/><path d="M50 7v10M50 83v10M7 50h10M83 50h10M20 20l7 7M73 73l7 7M80 20l-7 7M27 73l-7 7"/><path class="needle fill" data-rotate="data.windDirection" d="M50 13 41 57l9-5 9 5z"/></svg>
    <div><b>WIND</b><span><i data-text="data.windSpeed"></i> km/h</span></div>
    <div class="aqi"><b>AIR QUALITY</b><strong data-text="data.aqi"></strong></div>
  </div>
  <div class="forecast">
    <div><b data-text="data.forecast0Time"></b><i class="qw-icon qw-icon-sm" data-class="data.forecast0Icon" aria-hidden="true"></i><span data-text="data.forecast0Temp"></span></div>
    <div><b data-text="data.forecast1Time"></b><i class="qw-icon qw-icon-sm" data-class="data.forecast1Icon" aria-hidden="true"></i><span data-text="data.forecast1Temp"></span></div>
    <div><b data-text="data.forecast2Time"></b><i class="qw-icon qw-icon-sm" data-class="data.forecast2Icon" aria-hidden="true"></i><span data-text="data.forecast2Temp"></span></div>
    <div><b data-text="data.forecast3Time"></b><i class="qw-icon qw-icon-sm" data-class="data.forecast3Icon" aria-hidden="true"></i><span data-text="data.forecast3Temp"></span></div>
  </div>
</section>
