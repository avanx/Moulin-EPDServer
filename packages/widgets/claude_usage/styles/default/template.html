<section class="usage">
    <h2 data-text="config.title"></h2>
    <div class="row">
        <div class="label"><b>5 Hour</b><strong><span data-text="data.fiveHourPercent"></span>%</strong></div>
        <i data-percent="data.fiveHourPercent"></i>
        <small data-text="data.fiveHourReset"></small>
    </div>
    <div class="row">
        <div class="label"><b>7 Day</b><strong><span data-text="data.sevenDayPercent"></span>%</strong></div>
        <i data-percent="data.sevenDayPercent"></i>
        <small data-text="data.sevenDayReset"></small>
    </div>
    <footer data-text="data.staleMessage"></footer>
</section>
